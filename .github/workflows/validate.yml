name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check scripts/new-world.mjs
          node --check scripts/check-world.mjs
          node --check scripts/research-run.mjs
      - name: Scaffold smoke test
        run: |
          tmp="$(mktemp -d)"
          node scripts/new-world.mjs "CI Test World" --root "$tmp"
          node scripts/check-world.mjs "$tmp/CI Test World"
